kind = "mobile"
previewPath = "/"
title = "WeatherGPT for Farmers"
description = "A phone-first weather companion for farmers with simple forecasts, crop-aware advice, local alerts, a visual map, voice-friendly chat, and a farmer interaction space for sharing local observations and tips."
version = "1.0.0"
id = "artifacts/weathergpt-farmers"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20184

[services.development]
run = "pnpm --filter @workspace/weathergpt-farmers run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/weathergpt-farmers", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/weathergpt-farmers", "run", "serve" ]

[services.env]
PORT = "20184"
BASE_PATH = "/"
